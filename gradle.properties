# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# AndroidX package structure
android.useAndroidX=true

# Non-transitive R classes for faster builds and smaller APKs
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel execution
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Parallel sync is disabled because Android Studio's LibraryFilePaths.populate
# uses a non-thread-safe HashMap, which causes ConcurrentModificationException
# during Gradle Sync.
# org.gradle.tooling.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
