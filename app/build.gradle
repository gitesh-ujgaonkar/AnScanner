plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.anscanner.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.anscanner.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Room schema export directory for migration verification
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        // Limit native ABIs to reduce APK size (~40MB vs ~80MB with all ABIs)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    // Java 17 source and target compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ViewBinding — generates type-safe binding classes for all XML layouts
    buildFeatures {
        viewBinding true
    }

    // Prevent compression of OpenCV native libs (required for proper loading)
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // ── AndroidX Core & UI ──────────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ── Lifecycle (ViewModel + LiveData) ─────────────────────────────────
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.6'

    // ── CameraX ─────────────────────────────────────────────────────────
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ── Room Persistence Library (Java annotationProcessor — no kapt) ──
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ── OpenCV Android SDK (official Maven Central artifact) ────────────
    implementation 'org.opencv:opencv:4.10.0'

    // ── Google AdMob (uncomment when google-services.json is added) ─────
    // implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // ── Firebase Analytics (uncomment when google-services.json is added)
    // implementation platform('com.google.firebase:firebase-bom:33.4.0')
    // implementation 'com.google.firebase:firebase-analytics'

    // ── Guava (required by CameraX ListenableFuture) ────────────────────
    implementation 'com.google.guava:guava:32.1.3-android'

    // ── Testing ─────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
